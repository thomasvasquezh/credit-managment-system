services:
  mysql-ms-auth:
    image: mysql:8.4
    container_name: mysql-ms-auth
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ms_auth_db
      MYSQL_USER: ${MYSQL_USER:-auth_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-auth_pass}
    ports:
      - "3307:3306"
    volumes:
      - mysql_ms_auth_data:/var/lib/mysql

volumes:
  mysql_ms_auth_data: