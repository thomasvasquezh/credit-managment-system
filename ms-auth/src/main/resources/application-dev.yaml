# esta sera una configuración minima para levantar ms-auth sin config server
spring:
  datasource:
    url: jdbc:mysql://localhost:3307/ms_auth_db
    username: auth_user
    password: auth_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: 900
    issuer: ms-auth
